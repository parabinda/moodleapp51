name: Build Android Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android SDK packages
      run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
    
    - name: Install dependencies
      run: |
        npm install -g @ionic/cli cordova
        npm ci
    
    - name: Build Android AAB
      run: |
        ionic cordova platform add android@13.0.0
        npm run prod --prefix cordova-plugin-moodleapp
        NODE_ENV=production ionic cordova build android --release --prod -- --packageType=bundle
    
    - name: Upload AAB
      uses: actions/upload-artifact@v4
      with:
        name: android-bundle
        path: platforms/android/app/build/outputs/bundle/release/app-release.aab
